# Cloudflare Pages configuration.
# Once this file is present, bindings are managed HERE ONLY —
# the dashboard (Settings -> Bindings) is disabled for this project.

name = "plughub"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "plughub"
database_id = "e1ffe1ff-d70d-472b-92ec-965840ac4959"

[[r2_buckets]]
binding = "BLOB"
bucket_name = "plughub"

compatibility_date = "2025-10-01"
